          <path d="M9 10H27 M9 17H27 M9 24H27" stroke="#6fe2d4" stroke-width="2" stroke-linecap="round"/>
        </g>
        <text x="405" y="317" font-size="15" font-weight="730" fill="#f0f4ff">Custom VAE</text>
        <text x="405" y="336" font-size="11" fill="#9db0cb">16-channel</text>
        <text x="358" y="369" font-size="10.5" fill="#9daec8">Decode latent → RGB</text>
        <rect x="358" y="383" width="147" height="7" rx="3.5" fill="#263950"/>
        <rect x="358" y="383" width="92" height="7" rx="3.5" fill="url(#cool)"/>

        <rect x="29" y="265" width="282" height="142" rx="14" fill="url(#card)" stroke="#4a5d78"/>
        <text x="45" y="289" font-size="10" font-weight="750" letter-spacing="1.1" fill="#ffb47b">07 / RECONSTRUCTION SPACE</text>
        <g transform="translate(45 302)">
          <rect width="74" height="74" rx="9" fill="#172842" stroke="#455d7a"/>
          <circle cx="55" cy="18" r="8" fill="#ffbb70"/>
          <path d="M4 57L24 34L40 48L53 37L70 58V70H4Z" fill="#58a8a1"/>
