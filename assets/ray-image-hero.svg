        <text x="289" y="21" font-size="10.5" font-weight="650" letter-spacing=".3" fill="#9eb1cb">CHECKPOINT PROVENANCE</text>
        <path d="M490 10V24" stroke="#344961"/>
        <text x="507" y="21" font-size="10.5" font-weight="650" letter-spacing=".3" fill="#9eb1cb">REPRODUCIBLE SMOKE TESTS</text>
