    <text x="76" y="586" font-size="10.5" font-weight="650" letter-spacing="1.15" fill="#7287a7">RAY-IMAGE / ENGINEERING NOTEBOOK</text>
    <text x="1525" y="586" text-anchor="end" font-size="10.5" font-weight="650" letter-spacing="1.15" fill="#7287a7">RESEARCH PREVIEW · NOT A RELEASE CLAIM</text>
  </g>
