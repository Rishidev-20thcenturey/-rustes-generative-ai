          <path d="M5 12H27 M5 18H20" stroke="#89a5c7" stroke-opacity=".65" stroke-width="2" stroke-linecap="round"/>
        </g>
        <text x="133" y="324" font-size="15" font-weight="730" fill="#f0f4ff">256 × 256</text>
        <text x="133" y="344" font-size="11.5" fill="#a8bad3">RGB image target</text>
        <text x="133" y="367" font-size="10.5" fill="#7992b3">Illustrative diagram only.</text>
        <text x="133" y="382" font-size="10.5" fill="#7992b3">Not a generated result.</text>
      </g>
      <g stroke="#718bad" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
        <path d="M563 338H526"/>
        <path d="M342 338H315"/>
      </g>

      <g transform="translate(29 435)">
        <rect width="696" height="34" rx="9" fill="#101d2e" stroke="#344961"/>
        <circle cx="17" cy="17" r="3.5" fill="#62d9ce"/>
